[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nokov-to-smplx"
version = "0.1.0"
description = "Native-clock common23 NOKOV BVH to fixed-shape SMPL-X parameters"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nokov-to-smplx = "nokov_to_smplx.__main__:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["nokov_to_smplx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
